<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Retours testeurs — Les Éclaireurs</title>
    <style>
      :root {
        --fond: #f6f7f9; --surface: #fff; --bordure: #d8dee7;
        --texte: #14202e; --doux: #5a6b7d; --bleu: #1a56db;
        --rouge: #b42318; --rouge-f: #fdecea; --vert: #15803d; --vert-f: #e8f5ec;
        --orange: #b45309; --orange-f: #fdf3e3;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--fond); color: var(--texte);
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .page { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
      h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -.01em; }
      h2 { font-size: 1.02rem; margin: 0; letter-spacing: -.01em; }
      .doux { color: var(--doux); font-size: .88rem; }
      .carte { background: var(--surface); border: 1px solid var(--bordure);
        border-radius: 12px; padding: 14px; margin-bottom: 12px; }
      .carte.active { border-color: var(--bleu); box-shadow: 0 0 0 3px rgba(26,86,219,.10); }
      label { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: .03em; color: var(--doux); margin: 10px 0 5px; }
      input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--bordure);
        border-radius: 9px; font: inherit; background: #fff; color: var(--texte); }
      select.mince { width: auto; min-width: 190px; padding: 6px 9px; font-size: .84rem; }
      textarea { min-height: 60px; resize: vertical; }
      button { font: inherit; cursor: pointer; }
      .primaire { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 9px;
        background: var(--bleu); color: #fff; font-weight: 700; }
      .primaire:disabled { opacity: .55; cursor: not-allowed; }
      .discret { min-height: 36px; padding: 6px 11px; border: 1px solid var(--bordure);
        border-radius: 999px; background: #fff; color: var(--texte); font-size: .82rem; font-weight: 600; }
      .discret[aria-pressed="true"] { border-color: var(--bleu); background: #eef3fd; color: var(--bleu); }
      .ligne { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
      .entre { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .etiq { font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
        background: #eef1f5; color: var(--doux); white-space: nowrap; }
      .e-bug { background: var(--rouge-f); color: var(--rouge); }
      .e-evolution { background: #eef3fd; color: var(--bleu); }
      .e-bloquant { background: var(--rouge-f); color: var(--rouge); }
      .e-nouveau { background: var(--orange-f); color: var(--orange); }
      .e-en_cours { background: #eef3fd; color: var(--bleu); }
      .e-traite { background: var(--vert-f); color: var(--vert); }
      .e-P0 { background: var(--rouge); color: #fff; }
      .e-P1 { background: var(--orange-f); color: var(--orange); }
      .e-P2 { background: #eef3fd; color: var(--bleu); }
      .e-P3 { background: #eef1f5; color: var(--doux); }
      .e-technique { background: #ecfdf5; color: #047857; }
      .e-produit { background: #f5f3ff; color: #6d28d9; }
      .e-lot { background: var(--bleu); color: #fff; }
      .chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
        gap: 10px; margin-bottom: 16px; }
      .chiffre { background: var(--surface); border: 1px solid var(--bordure);
        border-radius: 12px; padding: 10px 12px; }
      .chiffre strong { display: block; font-size: 1.6rem; line-height: 1.15; }
      .chiffre span { font-size: .78rem; color: var(--doux); }
      .msg { padding: 10px 12px; border-radius: 9px; font-size: .88rem; margin: 10px 0; }
      .msg-ko { background: var(--rouge-f); color: var(--rouge); }
      .msg-ok { background: var(--vert-f); color: var(--vert); }
      .meta { font-size: .78rem; color: var(--doux); word-break: break-word; }
      .corps { white-space: pre-wrap; margin: 8px 0; }
      details summary { cursor: pointer; font-size: .8rem; color: var(--doux); }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
        font-size: .78rem; margin: 8px 0 0; }
      dt { color: var(--doux); font-weight: 600; }
      dd { margin: 0; word-break: break-all; }
      .rapport { white-space: pre-wrap; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #fbfcfd; border: 1px solid var(--bordure); border-radius: 10px;
        padding: 14px; max-height: 62vh; overflow-y: auto; }
      .onglets { display: flex; gap: 7px; margin-bottom: 14px; }
      .onglets .discret { min-height: 40px; border-radius: 9px; }
      .item { display: flex; gap: 9px; align-items: baseline; padding: 6px 0;
        border-top: 1px solid #edf0f4; font-size: .9rem; }
      .item:first-of-type { border-top: 0; }
      .item .ref { color: var(--doux); font-size: .78rem; font-weight: 700; min-width: 26px; }
      .sep { height: 1px; background: var(--bordure); margin: 12px 0; border: 0; }
      .fin { font-size: .78rem; color: var(--doux); margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="page" id="page">Chargement…</div>

    <script type="module">
      const URL_BASE = 'https://eutjonpxqoxldrkhxjzt.supabase.co'
      const CLE = 'sb_publishable_EJr8VnCNYyJGFFTwH81JlQ_-ithQD1C'
      const CLE_SESSION = 'eclaireurs-auth' // même session que le site

      const page = document.getElementById('page')
      const echapper = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        )

      function session() {
        try {
          const s = JSON.parse(localStorage.getItem(CLE_SESSION) || 'null')
          if (s?.expires_at && s.expires_at * 1000 < Date.now()) return null
          return s
        } catch { return null }
      }

      const entetes = () => ({
        apikey: CLE,
        Authorization: `Bearer ${session()?.access_token || CLE}`,
        'Content-Type': 'application/json',
      })

      async function api(chemin, options = {}) {
        const r = await fetch(`${URL_BASE}/rest/v1/${chemin}`, { headers: entetes(), ...options })
        if (!r.ok) throw new Error(`${r.status} ${await r.text()}`)
        return r.status === 204 ? null : r.json()
      }

      /** Écrit une modification sur un retour et la reporte dans les données locales. */
      async function majRetour(id, champs) {
        await api(`retours?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(champs) })
        const r = retours.find((x) => x.id === id)
        if (r) Object.assign(r, champs)
      }

      /* ─────────── Connexion ─────────── */

      function ecranConnexion(erreur) {
        page.innerHTML = `
          <h1>Retours testeurs</h1>
          <p class="doux">Espace réservé à l'équipe.</p>
          <form class="carte" id="f">
            ${erreur ? `<p class="msg msg-ko">${echapper(erreur)}</p>` : ''}
            <label for="e">Adresse e-mail</label>
            <input id="e" type="email" autocomplete="email" required />
            <label for="m">Mot de passe</label>
            <input id="m" type="password" autocomplete="current-password" required />
            <button class="primaire" style="margin-top:14px;width:100%">Se connecter</button>
          </form>`
        document.getElementById('f').onsubmit = async (ev) => {
          ev.preventDefault()
          const bouton = ev.target.querySelector('button')
          bouton.disabled = true
          try {
            const r = await fetch(`${URL_BASE}/auth/v1/token?grant_type=password`, {
              method: 'POST',
              headers: { apikey: CLE, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: document.getElementById('e').value,
                password: document.getElementById('m').value,
              }),
            })
            const d = await r.json()
            if (!r.ok) throw new Error(d.error_description || d.msg || 'Connexion refusée')
            localStorage.setItem(CLE_SESSION, JSON.stringify(d))
            demarrer()
          } catch (err) {
            ecranConnexion(err.message)
          }
        }
      }

      /* ─────────── Données ─────────── */

      const LIB_TYPE = { bug: 'Bug', evolution: 'Évolution', question: 'Question', autre: 'Autre' }
      const LIB_STATUT = { nouveau: 'Nouveau', en_cours: 'En cours', traite: 'Traité', refuse: 'Refusé' }
      const LIB_GRAVITE = { bloquant: 'Bloquant', genant: 'Gênant', mineur: 'Mineur' }
      const LIB_CIBLE = { site: '🖥️ Site', pwa: '📱 Application', les_deux: '🖥️📱 Les deux' }
      const LIB_CAT = { technique: 'Technique', produit: 'Produit' }
      const PRIOS = ['P0', 'P1', 'P2', 'P3']
      const AIDE_PRIO = {
        P0: 'Bloquant : personne ne peut continuer',
        P1: 'Casse la crédibilité ou fausse le test',
        P2: 'Vrai défaut, non bloquant',
        P3: 'Hors périmètre pour l’instant',
      }
      const OUVERT = ['nouveau', 'en_cours']

      const filtres = { statut: '', application: '', type: '', categorie: '', priorite: '', chantier: '' }
      let vue = 'chantiers'
      let retours = []

      async function charger() {
        retours = await api('vue_retours?select=*&order=created_at.asc&limit=500')
      }

      const lotDuJour = () => new Date().toISOString().slice(0, 10)
      const estOuvert = (r) => OUVERT.includes(r.statut)
      const numero = (r) => (r.id_source ? Number(r.id_source) : 900)

      function chantiers() {
        const m = new Map()
        for (const r of retours) {
          const cle = r.chantier || 'Sans chantier'
          if (!m.has(cle)) m.set(cle, [])
          m.get(cle).push(r)
        }
        const liste = [...m.entries()].map(([nom, lignes]) => {
          const ouverts = lignes.filter(estOuvert)
          const prios = [...new Set(ouverts.map((r) => r.priorite).filter(Boolean))].sort()
          return {
            nom,
            lignes: lignes.sort((a, b) => numero(a) - numero(b)),
            ouverts,
            prios,
            actif: lignes.some((r) => r.lot && estOuvert(r)),
            cibles: [...new Set(lignes.map((r) => r.application))],
            cats: [...new Set(lignes.map((r) => r.categorie).filter(Boolean))],
          }
        })
        return liste.sort((a, b) => {
          if (a.actif !== b.actif) return a.actif ? -1 : 1
          const pa = a.prios[0] || 'P9', pb = b.prios[0] || 'P9'
          if (pa !== pb) return pa < pb ? -1 : 1
          if (a.ouverts.length !== b.ouverts.length) return b.ouverts.length - a.ouverts.length
          return a.nom.localeCompare(b.nom, 'fr')
        })
      }

      function filtrer() {
        return retours.filter(
          (r) =>
            (!filtres.statut || r.statut === filtres.statut) &&
            (!filtres.application || r.application === filtres.application) &&
            (!filtres.type || r.type === filtres.type) &&
            (!filtres.categorie || r.categorie === filtres.categorie) &&
            (!filtres.priorite ||
              (filtres.priorite === 'aucune' ? !r.priorite : r.priorite === filtres.priorite)) &&
            (!filtres.chantier || (r.chantier || 'Sans chantier') === filtres.chantier)
        )
      }

      /* ─────────── Vue par chantier ─────────── */

      function carteChantier(c) {
        return `
          <article class="carte ${c.actif ? 'active' : ''}" data-chantier="${echapper(c.nom)}">
            <div class="entre">
              <div>
                <h2>${echapper(c.nom)}</h2>
                <div class="ligne" style="margin-top:6px">
                  ${c.prios.map((p) => `<span class="etiq e-${p}">${p}</span>`).join('')}
                  ${c.cats.map((k) => `<span class="etiq e-${k}">${LIB_CAT[k]}</span>`).join('')}
                  ${c.cibles.map((k) => `<span class="etiq">${LIB_CIBLE[k] ?? k}</span>`).join('')}
                  ${c.actif ? '<span class="etiq e-lot">Lot en cours</span>' : ''}
                </div>
              </div>
              <span class="meta">${c.ouverts.length} ouvert${c.ouverts.length > 1 ? 's' : ''} / ${c.lignes.length}</span>
            </div>

            <hr class="sep" />

            ${c.lignes
              .map(
                (r) => `
              <div class="item">
                <span class="ref">${r.id_source ? '#' + echapper(r.id_source) : '—'}</span>
                <span class="etiq e-${r.priorite || 'P3'}">${r.priorite || '—'}</span>
                <span style="flex:1">${echapper(r.message.slice(0, 130))}${r.message.length > 130 ? '…' : ''}</span>
                <span class="etiq e-${echapper(r.statut)}">${LIB_STATUT[r.statut] ?? r.statut}</span>
              </div>`
              )
              .join('')}

            <div class="ligne" style="margin-top:12px">
              ${
                c.actif
                  ? `<button class="discret" data-act="retirer">Retirer du lot</button>`
                  : c.ouverts.length
                    ? `<button class="primaire" data-act="activer">Activer ce chantier</button>`
                    : `<span class="doux">Rien d’ouvert dans ce chantier.</span>`
              }
              <button class="discret" data-act="voir">Voir les retours en détail</button>
            </div>
          </article>`
      }

      function brancherChantier(el) {
        const nom = el.dataset.chantier
        const cible = nom === 'Sans chantier' ? 'is.null' : `eq.${encodeURIComponent(nom)}`
        el.querySelectorAll('[data-act]').forEach((b) => {
          b.onclick = async () => {
            if (b.dataset.act === 'voir') {
              filtres.chantier = nom
              vue = 'retours'
              return dessiner()
            }
            const activer = b.dataset.act === 'activer'
            b.disabled = true
            try {
              await api(`retours?chantier=${cible}&statut=in.(nouveau,en_cours)`, {
                method: 'PATCH',
                body: JSON.stringify(
                  activer
                    ? { lot: lotDuJour(), statut: 'en_cours' }
                    : { lot: null, statut: 'nouveau' }
                ),
              })
              await charger()
              await dessiner()
            } catch (e) {
              alert('Mise à jour impossible : ' + e.message)
              b.disabled = false
            }
          }
        })
      }

      /* ─────────── Vue par retour ─────────── */

      function carteRetour(r, listeChantiers) {
        const date = new Intl.DateTimeFormat('fr-FR', { dateStyle: 'short' }).format(
          new Date(r.created_at)
        )
        const divergence =
          r.priorite && r.priorite_proposee && r.priorite !== r.priorite_proposee
            ? `<span class="meta" style="margin-left:4px">proposé : ${r.priorite_proposee}</span>`
            : ''
        return `
          <article class="carte" data-id="${r.id}">
            <div class="entre">
              <div class="ligne">
                ${r.id_source ? `<span class="etiq">#${echapper(r.id_source)}</span>` : ''}
                <span class="etiq e-${echapper(r.type)}">${LIB_TYPE[r.type] ?? r.type}</span>
                ${r.gravite ? `<span class="etiq e-${echapper(r.gravite)}">${LIB_GRAVITE[r.gravite]}</span>` : ''}
                <span class="etiq">${LIB_CIBLE[r.application] ?? r.application}</span>
                <span class="etiq e-${echapper(r.statut)}">${LIB_STATUT[r.statut] ?? r.statut}</span>
                ${r.lot ? `<span class="etiq e-lot">Lot ${echapper(r.lot)}</span>` : ''}
              </div>
              <span class="meta">${date}</span>
            </div>

            <p class="corps">${echapper(r.message)}</p>
            <p class="meta">${echapper(r.auteur)}${r.metier ? ' · ' + echapper(r.metier) : ''}${
              r.ecran ? ' · écran : ' + echapper(r.ecran) : ''
            }${r.origine !== 'bouton' ? ' · source : ' + echapper(r.origine) : ''}${
              r.priorite_demandeur ? ' · demandé en ' + echapper(r.priorite_demandeur) : ''
            }</p>

            <label>Priorité</label>
            <div class="ligne">
              ${PRIOS.map(
                (p) =>
                  `<button class="discret" data-prio="${p}" title="${AIDE_PRIO[p]}" aria-pressed="${
                    r.priorite === p
                  }">${p}</button>`
              ).join('')}
              <button class="discret" data-prio="" aria-pressed="${!r.priorite}">—</button>
              ${divergence}
            </div>

            <label>Nature</label>
            <div class="ligne">
              ${Object.entries(LIB_CAT)
                .map(
                  ([k, l]) =>
                    `<button class="discret" data-cat="${k}" aria-pressed="${r.categorie === k}">${l}</button>`
                )
                .join('')}
              <select class="mince" data-chantier-sel aria-label="Chantier">
                <option value="">— sans chantier —</option>
                ${listeChantiers
                  .map(
                    (n) =>
                      `<option value="${echapper(n)}" ${r.chantier === n ? 'selected' : ''}>${echapper(n)}</option>`
                  )
                  .join('')}
              </select>
            </div>

            <details>
              <summary>Contexte technique</summary>
              <dl>
                <dt>URL</dt><dd>${echapper(r.url)}</dd>
                <dt>Version</dt><dd>${echapper(r.version)}</dd>
                <dt>Écran</dt><dd>${echapper(r.taille_ecran)}</dd>
                <dt>Navigateur</dt><dd>${echapper(r.navigateur)}</dd>
              </dl>
            </details>

            <label for="rep-${r.id}">Réponse au demandeur — reprise telle quelle dans le point hebdomadaire</label>
            <textarea id="rep-${r.id}" data-reponse placeholder="Ce que vous direz à ${echapper(
              r.auteur
            )}. En clair, sans jargon.">${echapper(r.reponse || '')}</textarea>

            <label for="n-${r.id}">Note interne — le pourquoi technique, pour l’équipe</label>
            <textarea id="n-${r.id}" data-note>${echapper(r.note_interne || '')}</textarea>
            <div class="ligne" style="margin-top:10px">
              ${Object.entries(LIB_STATUT)
                .map(
                  ([id, lib]) =>
                    `<button class="discret" data-statut="${id}" aria-pressed="${r.statut === id}">${lib}</button>`
                )
                .join('')}
            </div>
            <p class="fin" data-fin></p>
          </article>`
      }

      function brancherRetour(el) {
        const id = el.dataset.id
        const note = el.querySelector('[data-note]')
        const reponse = el.querySelector('[data-reponse]')
        const fin = el.querySelector('[data-fin]')
        const dire = (t) => {
          fin.textContent = t
          setTimeout(() => (fin.textContent = ''), 1600)
        }
        const groupe = (sel, champ, transformer = (v) => v || null) =>
          el.querySelectorAll(sel).forEach((b) => {
            b.onclick = async () => {
              const valeur = transformer(b.dataset[champ === 'priorite' ? 'prio' : 'cat'])
              el.querySelectorAll(sel).forEach((x) =>
                x.setAttribute('aria-pressed', x === b ? 'true' : 'false')
              )
              try {
                await majRetour(id, { [champ]: valeur })
                dire('Enregistré.')
              } catch (e) {
                dire('Échec : ' + e.message)
              }
            }
          })

        groupe('[data-prio]', 'priorite')
        groupe('[data-cat]', 'categorie')

        el.querySelector('[data-chantier-sel]').onchange = async (ev) => {
          try {
            await majRetour(id, { chantier: ev.target.value || null })
            dire('Chantier mis à jour.')
          } catch (e) {
            dire('Échec : ' + e.message)
          }
        }

        el.querySelectorAll('[data-statut]').forEach((b) => {
          b.onclick = async () => {
            el.querySelectorAll('[data-statut]').forEach((x) =>
              x.setAttribute('aria-pressed', x === b ? 'true' : 'false')
            )
            try {
              await majRetour(id, {
                statut: b.dataset.statut,
                note_interne: note.value.trim() || null,
                reponse: reponse.value.trim() || null,
              })
              dire(
                ['traite', 'refuse'].includes(b.dataset.statut) && !reponse.value.trim()
                  ? 'Enregistré — mais sans réponse au demandeur, ce retour sortira vide du point hebdomadaire.'
                  : 'Enregistré.'
              )
            } catch (e) {
              dire('Échec : ' + e.message)
            }
          }
        })
      }

      /* ─────────── Point hebdomadaire ───────────
         Groupé par demandeur, et non par chantier : chacun veut d'abord savoir
         ce qu'on a fait de SES remarques. La réponse envoyée est la colonne
         `reponse`, jamais la note interne — celle-ci parle de code. */

      let jours = 7

      function texteRapport() {
        const depuis = Date.now() - jours * 86400000
        const recent = (r) => new Date(r.updated_at || r.created_at).getTime() >= depuis
        const dateFr = new Intl.DateTimeFormat('fr-FR', { dateStyle: 'long' }).format(new Date())
        const clos = ['traite', 'refuse']

        const faits = retours.filter((r) => clos.includes(r.statut) && recent(r))
        const enCours = retours.filter((r) => r.statut === 'en_cours')
        const attente = retours.filter((r) => r.statut === 'nouveau')

        const L = []
        L.push(`Les Éclaireurs! — Point du ${dateFr}`)
        L.push('')
        L.push(
          `${faits.length} remarque${faits.length > 1 ? 's' : ''} traitée${
            faits.length > 1 ? 's' : ''
          } sur les ${jours} derniers jours · ${enCours.length} en cours · ${attente.length} à venir.`
        )
        L.push('')

        /* Ce qui a changé, vu depuis le produit et non depuis la liste */
        const parChantier = new Map()
        for (const r of faits) {
          const k = r.chantier || 'Divers'
          if (!parChantier.has(k)) parChantier.set(k, [])
          parChantier.get(k).push(r)
        }
        if (parChantier.size) {
          L.push('CE QUI A CHANGÉ')
          L.push('')
          for (const [ch, lignes] of parChantier) {
            const refs = lignes.map((r) => (r.id_source ? '#' + r.id_source : '')).filter(Boolean)
            L.push(
              `• ${ch} — ${lignes.length} remarque${lignes.length > 1 ? 's' : ''}${
                refs.length ? ' (' + refs.join(', ') + ')' : ''
              }`
            )
            const vues = new Set()
            for (const r of lignes) {
              const l = (r.reponse || '').split('\n')[0].trim()
              if (l && !vues.has(l)) {
                vues.add(l)
                L.push(`    ${l.length > 150 ? l.slice(0, 150) + '…' : l}`)
              }
            }
            L.push('')
          }
        }

        /* Réponse nominative */
        const parQui = new Map()
        for (const r of retours) {
          if (r.statut === 'refuse' && !recent(r)) continue
          const k = r.auteur || 'anonyme'
          if (!parQui.has(k)) parQui.set(k, [])
          parQui.get(k).push(r)
        }
        const ordre = [...parQui.entries()].sort((a, b) => b[1].length - a[1].length)

        L.push('RÉPONSE À CHAQUE REMARQUE')
        for (const [qui, lignes] of ordre) {
          const f = lignes.filter((r) => clos.includes(r.statut))
          const c = lignes.filter((r) => r.statut === 'en_cours')
          const a = lignes.filter((r) => r.statut === 'nouveau')
          L.push('')
          L.push(`── ${qui} — ${lignes.length} remarque${lignes.length > 1 ? 's' : ''} ──`)
          const bloc = (titre, tab, avecReponse) => {
            if (!tab.length) return
            L.push('')
            L.push(`${titre} (${tab.length})`)
            for (const r of tab) {
              const ref = r.id_source ? `#${r.id_source} ` : ''
              const msg = r.message.replace(/\s+/g, ' ').trim()
              L.push(`  ${ref}« ${msg.length > 110 ? msg.slice(0, 110) + '…' : msg} »`)
              if (avecReponse) {
                const rep = r.reponse || '(réponse à rédiger)'
                rep.split('\n').forEach((li) => L.push(`      → ${li}`))
              } else if (r.priorite) {
                L.push(`      → prévu, priorité ${r.priorite}`)
              }
            }
          }
          bloc('Traité', f, true)
          bloc('En cours', c, true)
          bloc('À venir', a, false)
        }

        L.push('')
        L.push('—')
        L.push(
          'Priorités : P0 bloquant · P1 casse la crédibilité ou fausse le test · ' +
            'P2 vrai défaut non bloquant · P3 hors périmètre pour l’instant.'
        )
        return L.join('\n')
      }

      /* ─────────── Écran ─────────── */

      async function dessiner() {
        const ouverts = retours.filter(estOuvert)
        const c = {
          total: retours.length,
          arbitrer: ouverts.filter((r) => !r.priorite).length,
          p0: ouverts.filter((r) => r.priorite === 'P0').length,
          p1: ouverts.filter((r) => r.priorite === 'P1').length,
          lot: ouverts.filter((r) => r.lot).length,
          traites: retours.filter((r) => r.statut === 'traite').length,
        }
        const listeChantiers = [
          ...new Set(retours.map((r) => r.chantier).filter(Boolean)),
        ].sort((a, b) => a.localeCompare(b, 'fr'))

        const bouton = (cle, valeur, libelle) =>
          `<button class="discret" data-f="${cle}" data-v="${echapper(valeur)}" aria-pressed="${
            filtres[cle] === valeur
          }">${libelle}</button>`

        const listeFiltree = filtrer()

        page.innerHTML = `
          <div class="entre" style="margin-bottom:14px">
            <div>
              <h1>Retours testeurs</h1>
              <p class="doux">${c.total} retour${c.total > 1 ? 's' : ''} — fichier de consolidation et bouton « Un retour ? » réunis</p>
            </div>
            <button class="discret" id="quitter">Se déconnecter</button>
          </div>

          <div class="chiffres">
            <div class="chiffre"><strong>${c.p0}</strong><span>P0 ouverts</span></div>
            <div class="chiffre"><strong>${c.p1}</strong><span>P1 ouverts</span></div>
            <div class="chiffre"><strong>${c.lot}</strong><span>dans le lot actif</span></div>
            <div class="chiffre"><strong>${c.arbitrer}</strong><span>sans priorité</span></div>
            <div class="chiffre"><strong>${c.traites}</strong><span>traités</span></div>
          </div>

          <div class="onglets">
            <button class="discret" data-vue="chantiers" aria-pressed="${vue === 'chantiers'}">Par chantier</button>
            <button class="discret" data-vue="retours" aria-pressed="${vue === 'retours'}">Retour par retour</button>
            <button class="discret" data-vue="rapport" aria-pressed="${vue === 'rapport'}">Point hebdomadaire</button>
          </div>

          ${
            vue === 'rapport'
              ? `<div class="carte">
                   <div class="ligne">
                     <span class="doux">Période :</span>
                     ${[7, 14, 30, 3650]
                       .map(
                         (j) =>
                           `<button class="discret" data-jours="${j}" aria-pressed="${
                             jours === j
                           }">${j === 3650 ? 'Tout' : j + ' jours'}</button>`
                       )
                       .join('')}
                     <button class="primaire" id="copier" style="margin-left:auto">Copier</button>
                   </div>
                   <p class="doux" style="margin:10px 0 0">
                     Ce texte reprend la colonne « réponse au demandeur », jamais la note interne.
                     Copiez-le dans votre e-mail — chacun y trouve ses propres remarques en premier.
                   </p>
                 </div>
                 <div class="rapport" id="txt-rapport">${echapper(texteRapport())}</div>`
              : vue === 'chantiers'
              ? `<p class="doux" style="margin:0 0 12px">
                   Activer un chantier passe ses retours ouverts en « en cours » et les marque
                   du lot du jour. C’est ce qui définit le prochain lot de mise en ligne.
                 </p>
                 ${chantiers().map(carteChantier).join('')}`
              : `<div class="carte">
                   <div class="ligne" style="margin-bottom:8px">
                     <span class="doux">Statut :</span>
                     ${bouton('statut', '', 'Tous')}
                     ${Object.entries(LIB_STATUT).map(([id, l]) => bouton('statut', id, l)).join('')}
                   </div>
                   <div class="ligne" style="margin-bottom:8px">
                     <span class="doux">Priorité :</span>
                     ${bouton('priorite', '', 'Toutes')}
                     ${PRIOS.map((p) => bouton('priorite', p, p)).join('')}
                     ${bouton('priorite', 'aucune', 'Sans')}
                   </div>
                   <div class="ligne" style="margin-bottom:8px">
                     <span class="doux">Nature :</span>
                     ${bouton('categorie', '', 'Toutes')}
                     ${Object.entries(LIB_CAT).map(([k, l]) => bouton('categorie', k, l)).join('')}
                     <span class="doux" style="margin-left:8px">Type :</span>
                     ${bouton('type', '', 'Tous')}
                     ${Object.entries(LIB_TYPE).map(([id, l]) => bouton('type', id, l)).join('')}
                   </div>
                   <div class="ligne">
                     <span class="doux">Cible :</span>
                     ${bouton('application', '', 'Toutes')}
                     ${Object.entries(LIB_CIBLE).map(([k, l]) => bouton('application', k, l)).join('')}
                     <select class="mince" id="fc" aria-label="Filtrer par chantier" style="margin-left:8px">
                       <option value="">Tous les chantiers</option>
                       ${['Sans chantier', ...listeChantiers]
                         .map(
                           (n) =>
                             `<option value="${echapper(n)}" ${
                               filtres.chantier === n ? 'selected' : ''
                             }>${echapper(n)}</option>`
                         )
                         .join('')}
                     </select>
                   </div>
                 </div>
                 <p class="doux" style="margin:0 0 12px">${listeFiltree.length} retour${
                   listeFiltree.length > 1 ? 's' : ''
                 } affiché${listeFiltree.length > 1 ? 's' : ''}.</p>
                 ${
                   listeFiltree.length
                     ? listeFiltree
                         .slice()
                         .sort((a, b) => (a.priorite || 'P9').localeCompare(b.priorite || 'P9') || numero(a) - numero(b))
                         .map((r) => carteRetour(r, listeChantiers))
                         .join('')
                     : '<div class="carte doux" style="text-align:center">Aucun retour pour ce filtre.</div>'
                 }`
          }`

        page.querySelectorAll('[data-vue]').forEach((b) => {
          b.onclick = () => {
            vue = b.dataset.vue
            dessiner()
          }
        })
        page.querySelectorAll('[data-f]').forEach((b) => {
          b.onclick = () => {
            filtres[b.dataset.f] = b.dataset.v
            dessiner()
          }
        })
        const fc = document.getElementById('fc')
        if (fc) fc.onchange = () => { filtres.chantier = fc.value; dessiner() }
        page.querySelectorAll('[data-jours]').forEach((b) => {
          b.onclick = () => { jours = Number(b.dataset.jours); dessiner() }
        })
        const copier = document.getElementById('copier')
        if (copier)
          copier.onclick = async () => {
            const t = document.getElementById('txt-rapport').textContent
            try {
              await navigator.clipboard.writeText(t)
              copier.textContent = 'Copié ✓'
            } catch {
              // Presse-papiers refusé (page non sécurisée, permission) : on sélectionne
              // le texte pour que Ctrl+C fonctionne quand même.
              const r = document.createRange()
              r.selectNodeContents(document.getElementById('txt-rapport'))
              const s = getSelection()
              s.removeAllRanges()
              s.addRange(r)
              copier.textContent = 'Sélectionné — Ctrl+C'
            }
            setTimeout(() => (copier.textContent = 'Copier'), 2500)
          }
        page.querySelectorAll('[data-chantier]').forEach(brancherChantier)
        page.querySelectorAll('[data-id]').forEach(brancherRetour)
        document.getElementById('quitter').onclick = () => {
          localStorage.removeItem(CLE_SESSION)
          ecranConnexion()
        }
      }

      /* ─────────── Démarrage ─────────── */

      async function demarrer() {
        if (!session()) return ecranConnexion()
        try {
          const uid = session().user?.id
          const profils = await api(`profils?select=role&id=eq.${uid}`)
          if (profils[0]?.role !== 'admin') {
            page.innerHTML = `
              <h1>Retours testeurs</h1>
              <p class="msg msg-ko">Ce compte n'a pas les droits d'administration.</p>
              <p class="doux">Depuis le SQL Editor Supabase :<br>
              <code>update public.profils set role = 'admin' where email = '…';</code></p>
              <button class="discret" id="q">Changer de compte</button>`
            document.getElementById('q').onclick = () => {
              localStorage.removeItem(CLE_SESSION)
              ecranConnexion()
            }
            return
          }
          await charger()
          await dessiner()
        } catch (e) {
          page.innerHTML = `<h1>Retours testeurs</h1><p class="msg msg-ko">${echapper(e.message)}</p>`
        }
      }

      demarrer()
    </script>
  </body>
</html>
